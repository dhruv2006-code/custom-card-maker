<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Handling</title>
    <link rel="stylesheet" href="style.css" />
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <div class="showform">
    <div class="formContainer">
        <form>
        <h2 class="meetingForm">Meeting form</h2>
        <h2>Image Url : </h2>
        <input required class="imgUrl" type="text" placeholder="Paste Your Image Url">
        <h2>Name : </h2>
        <input required class="Name" type="text" placeholder="Name Of the Person">
        <h2>Work : </h2>
        <input required class="agenda" type="text" placeholder="Purpose">
        <div class="category">

    <label for="urgent">
        <input type="radio" id="urgent" name="category" value="urgent">
        Urgent
    </label>

    <label for="less-urgent">
        <input type="radio" id="less-urgent" name="category" value="less-urgent">
        Less Urgent
    </label>

    <label for="delayed">
        <input type="radio" id="delayed" name="category" value="delayed">
        Can Be Delayed
    </label>

    <label for="not-important">
        <input type="radio" id="not-important" name="category" value="not-important">
        Not Important
    </label>
</div>
    <input id="submit" type="submit">
     </form>
    <button class="close">Close</button>
    </div>
   
</div>
    <div class="left-icon">
        <i class="Add ri-add-fill"></i>
        <i class="ri-arrow-up-s-line"></i>
        <i class="ri-arrow-down-s-line"></i>
    </div>
    <div class="cards">
        <div class="card-container">
            <div class="personal">
            <img class="profile" src="https://i.pinimg.com/1200x/24/b3/7b/24b37b71fbe6c5e0521594083988d33c.jpg" alt="">
            <h3 class="name">Rebecca</h3>
            <div class="urgency"></div>
            </div>
            <div class="other">
                <div class="work">
                <h5 class="mainwork">Work</h5>
                <h3 class="typeWork">Call</h3>
                </div>
                <div class="finalCategory">
                <h5 class="mainCategory">Category</h5>
                <h3 class="urgencyType">Emergency</h3>
            </div>
            </div>
        </div>
    </div>
    <div class="right">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
